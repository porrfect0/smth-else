# SSJ VPN — deployment settings (read by deploy.sh)

VPN_NAME="SSJ VPN"

SSH_USER="root"
SSH_PORT="22"

# Reality camouflage site: must be a real TLS 1.3 + HTTP/2 site reachable from the server.
REALITY_SNI="www.nvidia.com"

# Node 1: single protocol (VLESS + Reality + Vision), shown in the subscription as "Gemini"
NODE1_IP="2.26.55.113"
NODE1_NAME="Gemini"

# Node 2: three protocols, low-disk mode (no geo databases, capped journald)
NODE2_IP="201.8.94.161"
NODE2_NAME_VISION="SSJ VPN · Vision"
NODE2_NAME_XHTTP="SSJ VPN · XHTTP"
NODE2_NAME_RESERVE="SSJ VPN · Reserve"

# Subscription is served by node 1 (more disk space)
SUB_PORT="2096"
SUB_UPDATE_HOURS="12"

# Empty = latest Xray release; set e.g. "v25.10.15" to pin
XRAY_VERSION=""
